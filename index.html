<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Lo más leído en Wikipedia</title>
    <meta
      name="description"
      content="Ranking diario de los artículos más leídos de Wikipedia, comparado entre idiomas y cruzado por ID de Wikidata."
    />

    <!-- Open Graph exige URL absoluta, así que el dominio entra en build desde
         VITE_SITE_URL (.env). Si cambia el dominio, se cambia ahí y ya. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Wikipulso" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:title" content="Lo más leído en Wikipedia" />
    <meta
      property="og:description"
      content="Cada idioma es una línea. Un artículo leído en varias es un transbordo."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%/og.jpg" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="Cuatro líneas de colores convergen en anillos de transbordo sobre fondo azul medianoche."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <script>
      // Fija el tema antes del primer pintado para que no haya destello blanco.
      try {
        var stored = localStorage.getItem('wikipulso:tema')
        var dark =
          stored === 'dark' ||
          (stored === null && !window.matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
